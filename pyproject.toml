[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codeatlas"
version = "0.2.0"
description = "Semantic code search with a retrieval evaluation harness"
authors = [{ name = "Roy Carlous Christudass", email = "roy4edu@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "rank-bm25==0.2.2",
    "sentence-transformers==6.0.1",
    "snowballstemmer==3.1.1",
    "torch==2.14.0",
    "transformers==5.17.0",
    "tree-sitter==0.25.2",
    "tree-sitter-java==0.23.5",
    "tree-sitter-python==0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[project.scripts]
codeatlas = "codeatlas.cli:main"

[tool.setuptools.packages.find]
include = ["codeatlas*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/fixtures/corpus"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
ignore = ["E501", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
